<html>
  <head>
    <style>
      body {
        background: black;
        color: #000000;
        font-family: monospace;
        margin: 0;
        padding: 0;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 80px;
      } /* centers everything and pushes it all down */

      .eye {
        width: 600px;
        margin-bottom: 30px;
      } /* gives eye width and space between it and text */

      .messages {
        text-align: center;
        color: #8b0000;
        margin-top: 30px;
        margin-bottom: 30px;
      } /* creates the black text */
    </style>
  </head>
    <body>
      <div class="wrapper">
        <img src="https://raw.githubusercontent.com/SproutedOfItsDarkness/Darkness/main/eye.png"
          alt="eye.png"
          class="eye">

        <div class="messages">
          <h1>I breathe...</h1>
          <h2>You breathe...</h2>
          <h3>We all breathe...</h3>
          <h4>To not breathe...</h4>
        </div>
      </div>
    </body>
</html>
