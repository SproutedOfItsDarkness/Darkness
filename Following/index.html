<html>
  <head>
    <style>
      body {
        background: black;
        color: #000000;
        font-family: monospace;
        margin: 0;
        padding: 0;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 80px;
      } /* centers everything and pushes it all down */

      .eye {
        width: 600px;
        margin-top: 30px;
      } /* gives eye width and space between it and text */

      .normalmessages {
        text-align: center;
        color: #000000;
        margin-top: 30px;
      } /* creates the black text */

      .finalmessage {
        text-align: left;
        color: #000000;
        margin-top: 30px;
        margin-bottom: 30px;
        margin-left: 60px;
      }
      
    </style>
  </head>
    <body>
      <div class="normalmessages">
          <h1>It's getting closer now...</h1>
          <p>My screams of fear cannot save me...</p>
          <p>The devil grows closer...</p>
      <div class="finalmessage">
        <h1>I can feel its breath on me...</h1>
      <div class="wrapper">
        <a href="../Breathe/">
          <img src="https://raw.githubusercontent.com/SproutedOfItsDarkness/Darkness/main/eyegaze.png"
            alt="eyegaze.png"
            class="eye">
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
