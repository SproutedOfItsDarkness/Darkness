<html>
  <head>
    <style>
      body {
        background: black;
        color: #000000;
        font-family: monospace;
        margin: 0;
        padding: 0;
      }

      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 80px;
      } /* centers everything and pushes it all down */

      .eye {
        width: 600px;
        margin-top: 30px;
      } /* gives eye width and space between it and text */

      .messages {
        text-align: center;
        color: #000000;
      } /* creates the black text */
    </style>
  </head>
    <body>
      <div class="messages">
          <h1>I can only run and only hide...</h1>
          <p>Nobody else can seem to see its broken gaze...</p>
          <p>Can you see it too?...</p>
        
      <div class="wrapper">
        <img src="https://raw.githubusercontent.com/SproutedOfItsDarkness/Darkness/main/eye.png"
          alt="eye.png"
          class="eye">
        </div>
      </div>
    </body>
</html>
